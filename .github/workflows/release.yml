name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/slidebolt/*
      GONOSUMDB: github.com/slidebolt/*
      GONOSUMCHECK: github.com/slidebolt/*
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Configure private repos
        run: git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -o "dist/plugin-opencode_${GOOS}_${GOARCH}" ./cmd/plugin-opencode
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/plugin-opencode_${{ matrix.goos }}_${{ matrix.goarch }}
